<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>MiniChat WebSocket</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-title">MiniChat WebSocket</div>
      <div class="user-info">
        Usuario: <span id="usernameLabel"></span>
      </div>
    </div>

    <div id="messages"></div>

    <div class="input-row">
      <input id="msgInput" type="text" placeholder="Escribe un mensaje y presiona Enter..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
